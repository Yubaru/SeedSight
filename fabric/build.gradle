plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = '1.0.1+26.2'
group = 'com.burbaglurbus.seedsight'
base { archivesName = 'seedsight' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly files('libs/worldfinder-fabric-26.2-0.2.1.jar')
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/official/java', 'src/main/java'])
            include 'fr/asashiin/worldfinder/seedsight/**'
            include 'fr/asashiin/worldfinder/client/waypoint/**'
        }
        resources.setSrcDirs(['src/official/resources'])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java { withSourcesJar() }

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(file('libs/worldfinder-fabric-26.2-0.2.1.jar')) }) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/MANIFEST.MF'
    }
    from('../LICENSE')
    from('NOTICE.md')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('installBundle', Zip) {
    group = 'distribution'
    description = 'Packages the installable SeedSight mod for Minecraft 26.2.'
    dependsOn tasks.named('jar')
    archiveFileName = 'seedsight-1.0.1+26.2-install.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('mods') { from tasks.named('jar') }
    from('INSTALL.txt')
    from('../LICENSE')
}
